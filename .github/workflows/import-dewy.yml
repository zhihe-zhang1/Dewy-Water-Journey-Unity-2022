name: Import Dewy Unity 2022 Project

on:
  push:
    paths:
      - ".github/workflows/import-dewy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone prepared source project
        run: |
          git clone --depth 1 --branch transfer-zhihe \
            https://github.com/pure-alone/Dewy-Water-Journey-Unity-2022.git /tmp/dewy-source

      - name: Copy complete project
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/dewy-source/ ./

      - name: Remove source-only branch note from README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              " The original Unity 6 state is preserved on the `unity6-original-backup` branch.",
              ""
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: import complete Unity 2022.3.62f2 project"
            git push origin HEAD:main
          fi
